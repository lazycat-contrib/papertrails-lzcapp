version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/papertrails.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains:
    - kind: node
      version: 22.x
  run_buildscript: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Papertrails
    summary: "纸片旅行者穿越无尽立体书世界的网页小游戏。"
